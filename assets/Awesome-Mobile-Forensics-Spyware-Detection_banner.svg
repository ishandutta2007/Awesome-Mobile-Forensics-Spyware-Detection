<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .radar-sweep {
      transform-origin: 1040px 160px;
      animation: rotate-sweep 6s linear infinite;
    }
    .float-card1 {
      animation: float 4s ease-in-out infinite alternate;
    }
    .float-card2 {
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    .node-pulse {
      animation: blink 2s infinite ease-in-out alternate;
    }
    @keyframes rotate-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Blobs in background -->
  <circle cx="200" cy="100" r="160" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1040" cy="160" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="380" r="140" fill="#10b981" opacity="0.1" filter="url(#glow)" />

  <!-- Top Decorative Radar Screen / Dynamic Tech Element on the right -->
  <g opacity="0.65">
    <circle cx="1040" cy="160" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="1040" cy="160" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <circle cx="1040" cy="160" r="50" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,6" />
    <circle cx="1040" cy="160" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1040" cy="160" r="4" fill="#38bdf8" />
    <!-- Radar Sweep line -->
    <line class="radar-sweep" x1="1040" y1="160" x2="1140" y2="160" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
    <path class="radar-sweep" d="M 1040 160 L 1140 160 A 100 100 0 0 0 1110 90 Z" fill="url(#accent-cyan)" opacity="0.25" />
  </g>

  <!-- Dynamic Animated Tech Target Nodes -->
  <g class="float-card1">
    <rect x="940" y="270" width="210" height="58" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="965" cy="299" r="6" fill="#10b981" class="node-pulse" />
    <text x="982" y="295" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">MVT IOC SCANNER</text>
    <text x="982" y="312" font-family="sans-serif" font-size="11" fill="#94a3b8">STIX2 Pegasus Rule Active</text>
  </g>

  <g class="float-card2">
    <rect x="740" y="45" width="220" height="58" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.85" />
    <circle cx="765" cy="74" r="6" fill="#818cf8" class="node-pulse" />
    <text x="782" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">DFIR PARSERS</text>
    <text x="782" y="87" font-family="sans-serif" font-size="11" fill="#94a3b8">ALEAPP • iLEAPP • Artifacts</text>
  </g>

  <!-- Title & Branding Foreground (Never obstructed) -->
  <g transform="translate(60, 100)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#00f2fe" />
    <text x="28" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.8">CURATED DFIR &amp; CYBERSECURITY</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title-text">
      Mobile Forensics &amp; <tspan fill="url(#primary-grad)">Spyware Detection</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle-text">
      Enterprise SaaS Suites, Mercenary Spyware Hunters (Pegasus/MVT), &amp; Open-Source DFIR Tools
    </text>

    <!-- Badge Pills -->
    <g transform="translate(0, 140)">
      <!-- Pill 1: Pegasus & Mercenary Spyware -->
      <g transform="translate(0, 0)">
        <rect width="185" height="34" rx="17" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
        <text x="16" y="22" class="tag-text">🛡️ Mercenary Spyware</text>
      </g>

      <!-- Pill 2: iOS & Android Forensics -->
      <g transform="translate(195, 0)">
        <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="16" y="22" class="tag-text">📱 iOS &amp; Android DFIR</text>
      </g>

      <!-- Pill 3: Sysdiagnose & Backup Parsers -->
      <g transform="translate(385, 0)">
        <rect width="170" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
        <text x="16" y="22" class="tag-text">🔍 Artifact Extractors</text>
      </g>

      <!-- Pill 4: Network Traffic Forensics -->
      <g transform="translate(565, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
        <text x="16" y="22" class="tag-text">🌐 Network Triage</text>
      </g>
    </g>

    <!-- Bottom Metrics / Ecosystem Summary Bar -->
    <g transform="translate(0, 205)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="24" font-family="sans-serif" font-size="12" fill="#64748b">
        ⚡ Featuring <tspan fill="#e2e8f0" font-weight="600">Cellebrite, GrayKey, MSAB</tspan> &amp; <tspan fill="#e2e8f0" font-weight="600">MVT, Jadx, Frida, MobSF, ALEAPP, iLEAPP</tspan>
      </text>
    </g>
  </g>
</svg>
